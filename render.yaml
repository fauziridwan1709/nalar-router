services:
  - type: web
    name: nalar-router
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GROQ_API_KEY
        sync: false          # set in the Render dashboard
      - key: DEMO_MODE
        value: "true"        # exposes demo tenant keys to the console (reviewer convenience)
      - key: ADMIN_TOKEN
        generateValue: true
