name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Formatting (Prettier)
        run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Retrieval eval (no LLM, deterministic)
        run: npm run retrieval-eval
      - name: Routing eval (no LLM, deterministic)
        run: npm run routing-eval
